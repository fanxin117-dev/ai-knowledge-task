name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: knowledge
          POSTGRES_USER: fxyan
          POSTGRES_PASSWORD: qwe123
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fxyan -d knowledge"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://fxyan:qwe123@localhost:5432/knowledge?schema=public
      AI_PROVIDER: mock
      OPENAI_API_KEY: ""
      OPENAI_MODEL: gpt-5.2

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply database migrations
        run: npm run db:deploy

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type check
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm run test

      - name: Build
        run: npm run build
